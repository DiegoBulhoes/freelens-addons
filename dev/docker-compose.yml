name: freelens-addons

services:
  # Do not bind-mount /sys/fs/cgroup (pods hang in ContainerCreating) and do not use
  # network_mode: host (flannel would write bridges and iptables on the host, beside a VPN).
  k3s:
    image: rancher/k3s:v1.36.4-k3s1@sha256:edad48e12bf81c3a09ac1c05c0c0ffaaa22145980b989d6fae84543a76b83657
    profiles: ["cluster"]
    command:
      - server
      - --disable=traefik
      - --disable=metrics-server
      - --disable=servicelb
      - --write-kubeconfig-mode=644
      - --write-kubeconfig=/output/kubeconfig.yaml
      - --tls-san=127.0.0.1
      # Fixed: dev/cluster/cluster.sh checks it, and a hostname-named node is orphaned on recreate.
      - --node-name=freelens-addons-dev
      # Unreachable GC target: real FreeDiskSpaceFailed warnings for the ArgoCD overview.
      - --kubelet-arg=image-gc-high-threshold=1
      - --kubelet-arg=image-gc-low-threshold=0
    privileged: true
    ports:
      - "127.0.0.1:6443:6443"
    environment:
      K3S_TOKEN: ${K3S_TOKEN:-freelens-addons-dev}
    volumes:
      - ${DEV_KUBECONFIG_DIR:-/tmp/freelens-addons-k3s}:/output
      - k3s-server:/var/lib/rancher/k3s
    tmpfs:
      - /run
      - /var/run
    healthcheck:
      test: ["CMD", "kubectl", "get", "--raw=/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # network_mode: host reaches clusters routed through a host VPN, and k3s on 127.0.0.1.
  freelens:
    build:
      context: ./dev/freelens
      args:
        FREELENS_VERSION: ${FREELENS_VERSION:-1.10.3}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: freelens-addons/freelens:${FREELENS_VERSION:-1.10.3}
    network_mode: host
    environment:
      DISPLAY: ":99"
      SCREEN_GEOMETRY: ${SCREEN_GEOMETRY:-1600x900x24}
      VNC_PORT: ${VNC_PORT:-5900}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      KUBECONFIG: /home/dev/.kube/config
      # Set by `make e2e` to open the debugging port.
      FREELENS_EXTRA_ARGS: ${FREELENS_EXTRA_ARGS:-}
    volumes:
      # create_host_path: false, or a missing kubeconfig becomes a root-owned directory
      # and k3s, which writes it after a reboot, fails forever on "is a directory".
      - type: bind
        source: ${KUBECONFIG_PATH:?set KUBECONFIG_PATH in .env — see .env.example}
        target: /home/dev/.kube/config
        read_only: true
        bind:
          create_host_path: false
      - .:/workspace
      - ./packages:/home/dev/.freelens/extensions:ro
      - freelens-state:/home/dev/.config/Freelens
      - pnpm-store:/usr/local/share/pnpm/store
      - corepack-cache:/home/dev/.cache/node/corepack
    shm_size: "1gb"
    stop_grace_period: 10s
    restart: unless-stopped

volumes:
  k3s-server:
  freelens-state:
  pnpm-store:
  corepack-cache:
