# Deliberately imperfect (root, no limits): Trivy's config audit needs something to flag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # Old on purpose: a current tag has nothing to report.
          image: nginx:1.24.0
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: python:3.9-slim
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - containerPort: 8080
---
# Never ready, on purpose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken
  template:
    metadata:
      labels:
        app: broken
    spec:
      containers:
        - name: broken
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; sleep 5; exit 1"]
---
# Does not exist: audited from the manifest, never scanned. Trivy's "not looked at" state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unscannable
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unscannable
  template:
    metadata:
      labels:
        app: unscannable
    spec:
      containers:
        - name: unscannable
          image: registry.invalid/freelens-addons/nothing:1
---
# Reads secrets cluster-wide, for the RBAC assessment to flag.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-too-much
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
