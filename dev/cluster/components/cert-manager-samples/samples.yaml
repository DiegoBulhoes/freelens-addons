# Deliberately imperfect: each object below is one state the pages must render.
# Names use `.test` (RFC 2606): nothing resolves.

# Never ready: its Secret does not exist.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: broken-ca
  namespace: demo
spec:
  ca:
    secretName: no-such-secret
---
# states.sh deletes this CA once renewal-stalls and issuer-broken are issued.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: flaky-ca
  namespace: demo
spec:
  ca:
    secretName: flaky-ca-key
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flaky-ca-root
  namespace: demo
spec:
  isCA: true
  commonName: flaky-ca
  secretName: flaky-ca-key
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
# The solver's ingress class has no controller, so the Challenge stays pending.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pebble
spec:
  acme:
    server: https://pebble.acme-test.svc.cluster.local:14000/dir
    # Pebble's certificate is for localhost. A test server only.
    skipTLSVerify: true
    privateKeySecretRef:
      name: pebble-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nothing-serves-this
---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: web-tls
  namespace: demo
spec:
  secretName: web-tls
  dnsNames: [web.demo.test]
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    kind: ClusterIssuer
    name: demo-ca
---
# Ends within the month, never within the week: it renews eight days before its end.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ends-this-month
  namespace: demo
spec:
  secretName: ends-this-month
  dnsNames: [month.demo.test]
  duration: 480h
  renewBefore: 192h
  issuerRef:
    kind: ClusterIssuer
    name: demo-ca
---
# Ends within the week: alarm.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ends-this-week
  namespace: demo
spec:
  secretName: ends-this-week
  dnsNames: [week.demo.test]
  duration: 144h
  renewBefore: 24h
  issuerRef:
    kind: ClusterIssuer
    name: demo-ca
---
# Its issuer is broken by the seed after issue, so every renewal fails while it stays Ready.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: renewal-stalls
  namespace: demo
spec:
  secretName: renewal-stalls
  dnsNames: [stalls.demo.test]
  # Ninety days, so "renewal failing" does not turn into "expired" between runs.
  duration: 2160h
  renewBefore: 2159h57m
  issuerRef:
    kind: Issuer
    name: flaky-ca
---
# Issued on flaky-ca before states.sh breaks it: Ready, not issuing, no renewal due for months.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: issuer-broken
  namespace: demo
spec:
  secretName: issuer-broken
  dnsNames: [issuer-broken.demo.test]
  duration: 2160h
  issuerRef:
    kind: Issuer
    name: flaky-ca
---
# states.sh moves it, once issued, to the pebble issuer, whose server blocks its name: the new
# issue fails while the old certificate is served. The group is explicit so a re-apply restores it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: out-of-date
  namespace: demo
spec:
  secretName: out-of-date
  dnsNames: [out-of-date.demo.test]
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: demo-ca
---
# Its issuer does not exist.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orphan
  namespace: demo
spec:
  secretName: orphan
  dnsNames: [orphan.demo.test]
  issuerRef:
    kind: ClusterIssuer
    name: does-not-exist
---
# Its issuer is never ready.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: never-issued
  namespace: demo
spec:
  secretName: never-issued
  dnsNames: [never.demo.test]
  issuerRef:
    kind: Issuer
    name: broken-ca
---
# Stuck at the Challenge.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: acme-web
  namespace: demo
spec:
  secretName: acme-web
  dnsNames: [acme.demo.test]
  issuerRef:
    kind: ClusterIssuer
    name: pebble
---
# states.sh deletes it once issued: its Secret stays behind, naming a Certificate that is gone.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: retired-tls
  namespace: demo
spec:
  secretName: retired-tls
  dnsNames: [retired.demo.test]
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    kind: ClusterIssuer
    name: demo-ca
---

# Managed: ingress-shim creates the Certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: managed
  namespace: demo
  annotations:
    cert-manager.io/cluster-issuer: demo-ca
spec:
  tls:
    - hosts: [managed.demo.test]
      secretName: managed-tls
  rules:
    - host: managed.demo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# Unmanaged TLS Secret, on purpose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unmanaged
  namespace: demo
spec:
  tls:
    - hosts: [unmanaged.demo.test]
      secretName: hand-made-tls
  rules:
    - host: unmanaged.demo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# Its TLS Secret does not exist: missing, not unmanaged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missing-secret
  namespace: demo
spec:
  tls:
    - hosts: [missing.demo.test]
      secretName: nowhere-tls
  rules:
    - host: missing.demo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# Serves acme-web's Secret, which its Certificate never writes: being issued.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-web
  namespace: demo
spec:
  tls:
    - hosts: [acme.demo.test]
      secretName: acme-web
  rules:
    - host: acme.demo.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
---
# Placeholder values, never key material; the API server does not parse them.
# "failed to find any PEM data" on apply is expected.
apiVersion: v1
kind: Secret
metadata:
  name: hand-made-tls
  namespace: demo
type: kubernetes.io/tls
stringData:
  tls.crt: placeholder, not a certificate
  tls.key: placeholder, not a key
---
# Referenced by nothing, managed by nothing.
apiVersion: v1
kind: Secret
metadata:
  name: leftover-tls
  namespace: demo
type: kubernetes.io/tls
stringData:
  tls.crt: placeholder, not a certificate
  tls.key: placeholder, not a key
