---
# Its volumes ask for a storage class that does not exist, so its pods stay Pending.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: legacy-rs
  namespace: mongodb
spec:
  type: ReplicaSet
  members: 1
  version: "8.0.12"
  security:
    authentication:
      modes: ["SCRAM"]
  users: []
  # Small requests: the whole seed has to fit a CI runner's four CPUs.
  statefulSet:
    spec:
      template:
        spec:
          # The scheduler counts the largest init container too.
          initContainers:
            - name: mongod-posthook
              resources: { requests: { cpu: 25m, memory: 50M } }
            - name: mongodb-agent-readinessprobe
              resources: { requests: { cpu: 25m, memory: 50M } }
          containers:
            - name: mongod
              resources: { requests: { cpu: 25m, memory: 200M } }
            - name: mongodb-agent
              resources: { requests: { cpu: 25m, memory: 100M } }
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            storageClassName: no-such-class
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
---
# A version with no image: the upgrade never completes.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: upgrade-rs
  namespace: mongodb
spec:
  type: ReplicaSet
  members: 1
  version: "8.0.999"
  security:
    authentication:
      modes: ["SCRAM"]
  users: []
  # Small requests: the whole seed has to fit a CI runner's four CPUs.
  statefulSet:
    spec:
      template:
        spec:
          # The scheduler counts the largest init container too.
          initContainers:
            - name: mongod-posthook
              resources: { requests: { cpu: 25m, memory: 50M } }
            - name: mongodb-agent-readinessprobe
              resources: { requests: { cpu: 25m, memory: 50M } }
          containers:
            - name: mongod
              resources: { requests: { cpu: 25m, memory: 200M } }
            - name: mongodb-agent
              resources: { requests: { cpu: 25m, memory: 100M } }
---
# TLS from cert-manager: the demo CA issues it, and its Secret carries the CA too.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: secure-rs-tls
  namespace: mongodb
spec:
  secretName: secure-rs-tls
  issuerRef:
    kind: ClusterIssuer
    name: demo-ca
  dnsNames:
    - "*.secure-rs-svc.mongodb.svc.cluster.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: secure-admin-password
  namespace: mongodb
stringData:
  password: dev-secure-not-a-secret
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
