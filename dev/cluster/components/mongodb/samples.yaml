# MongoDB Community replica sets, one per state the pages rank. The operator watches its own
# namespace, so they live beside it. The passwords exist only inside this disposable cluster.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-admin-password
  namespace: mongodb
stringData:
  password: dev-catalog-not-a-secret
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: catalog-rs
  namespace: mongodb
spec:
  type: ReplicaSet
  members: 3
  version: "8.0.12"
  # catalog-rs-2 is the preferred primary.
  memberConfig:
    - votes: 1
      priority: "1"
    - votes: 1
      priority: "1"
    - votes: 1
      priority: "2"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: catalog-admin
      db: admin
      passwordSecretRef:
        name: catalog-admin-password
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
        - name: readWriteAnyDatabase
          db: admin
      scramCredentialsSecretName: catalog-admin-scram
  # Small requests: the whole seed has to fit a CI runner's four CPUs.
  statefulSet:
    spec:
      template:
        spec:
          # The scheduler counts the largest init container too.
          initContainers:
            - name: mongod-posthook
              resources: { requests: { cpu: 25m, memory: 50M } }
            - name: mongodb-agent-readinessprobe
              resources: { requests: { cpu: 25m, memory: 50M } }
          containers:
            - name: mongod
              resources: { requests: { cpu: 25m, memory: 200M } }
            - name: mongodb-agent
              resources: { requests: { cpu: 25m, memory: 100M } }
---
# Its only user's password Secret does not exist, so the operator stops before creating any pod.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: reporting-rs
  namespace: mongodb
spec:
  type: ReplicaSet
  members: 1
  version: "8.0.12"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: reporting
      db: admin
      passwordSecretRef:
        name: reporting-password
      roles:
        - name: read
          db: catalog
      scramCredentialsSecretName: reporting-scram
  # Small requests: the whole seed has to fit a CI runner's four CPUs.
  statefulSet:
    spec:
      template:
        spec:
          # The scheduler counts the largest init container too.
          initContainers:
            - name: mongod-posthook
              resources: { requests: { cpu: 25m, memory: 50M } }
            - name: mongodb-agent-readinessprobe
              resources: { requests: { cpu: 25m, memory: 50M } }
          containers:
            - name: mongod
              resources: { requests: { cpu: 25m, memory: 200M } }
            - name: mongodb-agent
              resources: { requests: { cpu: 25m, memory: 100M } }
