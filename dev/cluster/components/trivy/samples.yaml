# states.sh stalls its rollout: the old ReplicaSet keeps serving, with an SBOM and no verdict.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalled
  namespace: demo
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stalled
  template:
    metadata:
      labels:
        app: stalled
    spec:
      containers:
        - name: stalled
          image: nginx:1.24.0
