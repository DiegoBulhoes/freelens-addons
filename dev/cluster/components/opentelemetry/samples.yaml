# One workload per Coverage state. Sleeping is enough: the agent only adds an init container and env.
# Injected: "true" picks the namespace's only Instrumentation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: otel-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "2147483647"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
# Injected, by name.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: otel-apps
spec:
  replicas: 1
  serviceName: ledger
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
      annotations:
        instrumentation.opentelemetry.io/inject-python: "python"
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "2147483647"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
