---
# Injected: states.sh runs it once, as a Job it owns; the schedule never comes round in the seed's life.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: otel-batch
spec:
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nightly
          annotations:
            instrumentation.opentelemetry.io/inject-python: "otel-apps/python"
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 2
          containers:
            - name: app
              image: busybox:1.36
              command: ["true"]
              resources:
                requests: { cpu: 5m, memory: 8Mi }
---
# No Instrumentation: owned by nothing, and "true" finds none in otel-batch.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: otel-batch
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: migrate
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["true"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
