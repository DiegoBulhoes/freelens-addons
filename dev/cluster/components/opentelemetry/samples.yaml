# Blocked: Go is off by default in the operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: otel-blocked
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
      annotations:
        instrumentation.opentelemetry.io/inject-go: "otel-apps/python"
        instrumentation.opentelemetry.io/otel-go-auto-target-exe: /bin/sleep
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "2147483647"]
          resources:
            requests: { cpu: 5m, memory: 8Mi }
---
