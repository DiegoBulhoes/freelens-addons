# A rule the controller refuses (Ready=False): filepath.Match rejects the pattern.
# Never applied by the seed: on restart, v1.3.0 crash-loops while it exists.
# cluster.sh fixtures argocd applies it for the export and removes it.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: bad-pattern
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "image-updates-["
      images:
        - alias: podinfo
          imageName: ghcr.io/stefanprodan/podinfo:6.14.x
