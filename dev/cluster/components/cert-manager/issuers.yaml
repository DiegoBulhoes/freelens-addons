# The CA chain the samples' certificates come from. Fixtures and unit tests pin demo-ca by name.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# A ClusterIssuer reads its CA from cert-manager's own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-ca-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: demo-ca
  secretName: demo-ca-root
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: demo-ca
spec:
  ca:
    secretName: demo-ca-root
