# Test ACME server, so Orders and Challenges exist. Its certificate is for localhost,
# so the issuer skips verification: acceptable only here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: acme-test
  labels:
    app: pebble
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
          env:
            # No random validation delay.
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
            # No deliberate nonce rejection: it would make the seed's outcome random.
            - name: PEBBLE_WFE_NONCEREJECT
              value: "0"
          ports:
            - name: acme
              containerPort: 14000
          readinessProbe:
            tcpSocket:
              port: acme
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: acme-test
spec:
  selector:
    app: pebble
  ports:
    - name: acme
      port: 14000
      targetPort: acme
