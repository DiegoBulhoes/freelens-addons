name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Commit SHAs, not tags: a tag can be moved.
  CHECKOUT: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  SETUP_NODE: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      # Also re-checks every entry against minimumReleaseAge.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run -r type:check

      - name: Test
        run: pnpm run -r test:coverage

      - name: Build
        run: pnpm run -r build

      - name: Verify extension bundles
        run: bash scripts/checks/verify-bundles.sh

      - name: Verify the design standard
        run: bash scripts/checks/copy-design-standard.sh --check

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also checks FREELENS_SHA256 against the release.
      - name: Build the image
        run: docker build ./dev/freelens


