name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

# A release run is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep in step with scripts/security/scan.sh.
env:
  GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  OSV_SCANNER: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0
  HADOLINT: hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e # v2.14.0
  TRIVY: aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 # 0.69.1

jobs:
  lint:
    name: 1. Dependencies and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      # Before any install runs a dependency's code (docs/security.md).
      - name: Vulnerable dependencies and malware
        run: bash scripts/security/osv-direct.sh "${OSV_SCANNER}"
      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      # Also re-checks every entry against minimumReleaseAge.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Design standard copies
        run: bash scripts/checks/copy-design-standard.sh --check
      - name: E2E legs
        run: bash scripts/checks/e2e-legs.sh
      - name: Supply-chain policy
        run: bash scripts/security/verify-supply-chain.sh

  typecheck:
    name: 2. Typecheck
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run -r type:check

  test:
    name: 3. Unit tests
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fails under 95% coverage of each package's api/.
      - name: Unit tests
        run: pnpm run -r test:coverage

  build:
    name: 4. Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run -r build
      - name: Extension bundles
        run: bash scripts/checks/verify-bundles.sh

  security:
    name: 5. Secrets and Dockerfiles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          # Full history: a removed secret is still in the objects.
          fetch-depth: 0
          persist-credentials: false

      - name: Secrets, in the whole history
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS}" \
            detect --source=/repo --redact --verbose --no-banner

      # DL3008: the distributions keep only current apt versions; the base digest pins the set.
      - name: Dockerfiles
        run: |
          for dockerfile in dev/freelens/Dockerfile dev/act/Dockerfile; do
            docker run --rm -i "${HADOLINT}" hadolint --ignore DL3008 - < "${dockerfile}"
          done

  image:
    name: 6. Freelens image
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      # Also checks FREELENS_SHA256 against the release.
      - name: Build
        run: docker build -t freelens-addons/freelens:ci ./dev/freelens

      # Reports only: Electron and Chromium CVEs need a Freelens release to fix.
      - name: Image CVEs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY}" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --scanners vuln \
              freelens-addons/freelens:ci

  e2e:
    name: 7. End-to-end, ${{ matrix.leg }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [argocd, cert-manager, cnpg, mongodb, opentelemetry, prometheus, redis, trivy]
    env:
      PACKAGE: ${{ matrix.leg }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s|^KUBECONFIG_PATH=.*|KUBECONFIG_PATH=${DEV_KUBECONFIG_DIR:-/tmp/freelens-addons-k3s}/kubeconfig.yaml|; s|^USER_UID=.*|USER_UID=$(id -u)|; s|^USER_GID=.*|USER_GID=$(id -g)|" .env
          # Only under dev/act/run.sh: another project and other ports, set last so they win.
          env | grep -E '^(PROJECT|K3S_PORT|DEBUG_PORT|VNC_PORT|NOVNC_PORT|DEV_KUBECONFIG_DIR|USER_UID|USER_GID)=' >> .env || true
          kubectl version --client

      - name: Start the dev cluster
        run: make cluster PACKAGE="${PACKAGE}"

      - name: Read-only end-to-end
        run: make e2e PACKAGE="${PACKAGE}"

      - name: Real writes
        run: make e2e-writes PACKAGE="${PACKAGE}"

      # Every line guarded, so a failed leg still dumps its state.
      - name: What Freelens and the cluster said
        if: failure() || cancelled()
        timeout-minutes: 5
        run: |
          docker compose -p "${PROJECT:-freelens-addons}" -f dev/docker-compose.yml --project-directory . logs --tail=300 freelens || true
          dev/cluster/cluster.sh kubectl get pods -A || true
          dev/cluster/cluster.sh kubectl get events -A --field-selector reason=FailedScheduling || true
          if [[ "${PACKAGE}" == argocd ]]; then
            dev/cluster/cluster.sh kubectl -n argocd get applications.argoproj.io -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,OP:.status.operationState.phase || true
            dev/cluster/cluster.sh kubectl -n argocd get appprojects.argoproj.io -o custom-columns=NAME:.metadata.name,WINDOWS:.spec.syncWindows || true
            dev/cluster/cluster.sh kubectl -n argocd get imageupdaters.argocd-image-updater.argoproj.io -o custom-columns='NAME:.metadata.name,MATCHED:.status.applicationsMatched,READY:.status.conditions[?(@.type=="Ready")].status' || true
            dev/cluster/cluster.sh kubectl -n argocd logs statefulset/argocd-application-controller --tail=400 | grep -i -E 'error|level=warn' | tail -50 || true
            dev/cluster/cluster.sh kubectl -n argocd logs deployment/argocd-image-updater-controller --tail=400 | grep -i -E 'error|level=warn' | tail -50 || true
          fi
          if [[ "${PACKAGE}" == cert-manager ]]; then
            dev/cluster/cluster.sh kubectl get clusterissuers,issuers,certificates,certificaterequests,orders,challenges -A || true
            dev/cluster/cluster.sh kubectl get certificates -A -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,NOTAFTER:.status.notAfter,RENEWAL:.status.renewalTime,FAILED:.status.failedIssuanceAttempts' || true
            dev/cluster/cluster.sh kubectl -n cert-manager logs deployment/cert-manager --tail=400 | grep -i -E 'error|fail' | tail -20 || true
          fi
          if [[ "${PACKAGE}" == cnpg ]]; then
            dev/cluster/cluster.sh kubectl -n databases get clusters.postgresql.cnpg.io -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,PRIMARY:.status.currentPrimary,READY:.status.readyInstances || true
            dev/cluster/cluster.sh kubectl -n databases get clusters.postgresql.cnpg.io -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .status.conditions[*]}{.type}={.status} {.reason} {.message}; {end}{"\n"}{end}' || true
            dev/cluster/cluster.sh kubectl -n databases get backups.postgresql.cnpg.io,scheduledbackups.postgresql.cnpg.io,poolers.postgresql.cnpg.io -o wide || true
            dev/cluster/cluster.sh kubectl -n cnpg-system logs deployment/cnpg-controller-manager --tail=400 | grep -i error | tail -20 || true
            dev/cluster/cluster.sh kubectl -n cnpg-system logs deployment/barman-cloud --tail=100 || true
            for pod in $(dev/cluster/cluster.sh kubectl -n databases get pods -l cnpg.io/podRole=instance -o name || true); do
              dev/cluster/cluster.sh kubectl -n databases logs "${pod}" -c plugin-barman-cloud --tail=30 || true
            done
          fi
          if [[ "${PACKAGE}" == mongodb ]]; then
            dev/cluster/cluster.sh kubectl get mongodbcommunity -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,PHASE:.status.phase,VERSION:.status.version,MESSAGE:.status.message || true
            dev/cluster/cluster.sh kubectl -n mongodb get pods -o wide || true
            dev/cluster/cluster.sh kubectl -n mongodb-apps get pods -o wide || true
            dev/cluster/cluster.sh kubectl -n mongodb logs deployment/mongodb-kubernetes-operator --tail=400 | grep -i -E 'error|fail' | tail -20 || true
          fi
          if [[ "${PACKAGE}" == redis ]]; then
            dev/cluster/cluster.sh kubectl -n redis get pods --show-labels || true
            dev/cluster/cluster.sh kubectl -n redis get redisreplications -o custom-columns=NAME:.metadata.name,MASTER:.status.masterNode || true
            dev/cluster/cluster.sh kubectl -n redis get redisclusters,redissentinels,redis -o wide || true
            dev/cluster/cluster.sh kubectl -n redis-operator-system logs deployment/redis-operator-redis-operator --tail=100 || true
          fi
          if [[ "${PACKAGE}" == trivy ]]; then
            dev/cluster/cluster.sh kubectl -n trivy-system logs deployment/trivy-operator --tail=400 | grep -i error | tail -20 || true
            dev/cluster/cluster.sh kubectl -n demo get replicasets -o wide || true
            dev/cluster/cluster.sh kubectl get vulnerabilityreports,sbomreports,configauditreports -A -L trivy-operator.resource.kind,trivy-operator.resource.name || true
            dev/cluster/cluster.sh kubectl -n trivy-system get jobs,pods -o wide || true
          fi
          if [[ "${PACKAGE}" == opentelemetry || "${PACKAGE}" == prometheus ]]; then
            dev/cluster/cluster.sh kubectl get instrumentations,opentelemetrycollectors -A || true
            dev/cluster/cluster.sh kubectl -n opentelemetry-operator-system logs deployment/opentelemetry-operator-controller-manager -c manager --tail=400 | grep -i error | tail -20 || true
          fi
          if [[ "${PACKAGE}" == prometheus ]]; then
            dev/cluster/cluster.sh kubectl get prometheuses,prometheusagents,alertmanagers,servicemonitors,podmonitors,scrapeconfigs,prometheusrules -A || true
            dev/cluster/cluster.sh kubectl get events -A --field-selector reason=InvalidConfiguration || true
            dev/cluster/cluster.sh kubectl -n prometheus-operator logs deployment/prometheus-operator --tail=400 | grep -i -E 'error|invalid' | tail -20 || true
            dev/cluster/cluster.sh kubectl get --raw '/api/v1/namespaces/monitoring/pods/prometheus-seed-0:9090/proxy/api/v1/targets?state=active' \
              | python3 -c 'import json, sys; [print(t["health"], t["scrapePool"], t.get("lastError", "")) for t in json.load(sys.stdin)["data"]["activeTargets"]]' || true
            dev/cluster/cluster.sh kubectl get --raw /api/v1/namespaces/otel-collectors/services/scraper-targetallocator:80/proxy/jobs || true
          fi
          dev/cluster/cluster.sh kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -80 || true

  smoke:
    name: 8. Smoke, every extension on the full seed
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s|^KUBECONFIG_PATH=.*|KUBECONFIG_PATH=${DEV_KUBECONFIG_DIR:-/tmp/freelens-addons-k3s}/kubeconfig.yaml|; s|^USER_UID=.*|USER_UID=$(id -u)|; s|^USER_GID=.*|USER_GID=$(id -g)|" .env
          # Only under dev/act/run.sh: another project and other ports, set last so they win.
          env | grep -E '^(PROJECT|K3S_PORT|DEBUG_PORT|VNC_PORT|NOVNC_PORT|DEV_KUBECONFIG_DIR|USER_UID|USER_GID)=' >> .env || true
          kubectl version --client

      - name: Start the dev cluster
        run: make cluster

      - name: Every extension's pages
        run: make e2e FILES=pages-render

      - name: What Freelens and the cluster said
        if: failure() || cancelled()
        timeout-minutes: 5
        run: |
          docker compose -p "${PROJECT:-freelens-addons}" -f dev/docker-compose.yml --project-directory . logs --tail=300 freelens || true
          dev/cluster/cluster.sh kubectl get pods -A || true
          dev/cluster/cluster.sh kubectl get events -A --field-selector reason=FailedScheduling || true
          dev/cluster/cluster.sh kubectl -n trivy-system logs deployment/trivy-operator --tail=400 | grep -i error | tail -20 || true
          dev/cluster/cluster.sh kubectl -n demo get replicasets -o wide || true
          dev/cluster/cluster.sh kubectl get vulnerabilityreports,sbomreports,configauditreports -A -L trivy-operator.resource.kind,trivy-operator.resource.name || true
          dev/cluster/cluster.sh kubectl -n trivy-system get jobs,pods -o wide || true
          dev/cluster/cluster.sh kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp | tail -80 || true
