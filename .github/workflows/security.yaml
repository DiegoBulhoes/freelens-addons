name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Unchanged dependencies still acquire new CVEs.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Digest-pinned containers, never third-party actions. Keep in step with scripts/scan.sh.
env:
  GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
  OSV_SCANNER: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0
  HADOLINT: hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e # v2.14.0
  TRIVY: aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 # 0.69.1

jobs:
  policy:
    name: Supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/verify-supply-chain.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a removed secret is still in the objects.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan history for secrets
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS}" \
            detect --source=/repo --redact --verbose --no-banner

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fix with overrides in pnpm-workspace.yaml; osv-scanner.toml only for what cannot be fixed yet.
      - name: OSV scan
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo "${OSV_SCANNER}" \
            scan source --lockfile=/repo/pnpm-lock.yaml

  dockerfiles:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # DL3008: Debian keeps only current apt versions; the base digest pins the set.
      - name: hadolint
        run: |
          docker run --rm -i "${HADOLINT}" \
            hadolint --ignore DL3008 - < dev/freelens/Dockerfile

  image:
    name: Image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also checks FREELENS_SHA256 against the release.
      - name: Build the Freelens image
        run: docker build -t freelens-addons/freelens:ci ./dev/freelens

      # Reports only: Electron and Chromium CVEs need a Freelens release to fix.
      - name: Scan the image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "${TRIVY}" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --scanners vuln \
              freelens-addons/freelens:ci
