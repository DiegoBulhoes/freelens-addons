name: Release

# By hand, from main: CI runs first, on this commit, and only if it passes are the tarballs packed
# and the tag created.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Digest-pinned, as in ci.yaml. Keep in step with scripts/security/scan.sh.
env:
  OSV_SCANNER: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0

jobs:
  gate:
    name: Dependencies, version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same gate as CI, before anything installs.
      - name: Vulnerable dependencies and malware
        run: bash scripts/security/osv-direct.sh "${OSV_SCANNER}"

      # Before CI's hour, so a wrong branch, version or tag fails at once.
      - name: Main, one version, and a new tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "${GITHUB_REF}" == refs/heads/main ]] || { echo "releases come from main, not ${GITHUB_REF}" >&2; exit 1; }
          versions=$(jq -r .version packages/*/package.json | sort -u)
          [[ $(wc -l <<<"${versions}") -eq 1 ]] || { echo "the extensions disagree on their version: ${versions//$'\n'/ }" >&2; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${versions}" >/dev/null 2>&1; then
            echo "v${versions} exists already: set a new version first" >&2
            exit 1
          fi
          echo "tag=v${versions}" >> "${GITHUB_OUTPUT}"

  ci:
    name: CI
    needs: gate
    uses: ./.github/workflows/ci.yaml

  release:
    name: Tag and publish tarballs
    needs: [gate, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node, from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run -r build

      - name: Verify the bundles
        run: bash scripts/checks/verify-bundles.sh

      - name: Pack
        run: bash scripts/release/package-extensions.sh

      - name: Verify the tarballs
        run: |
          status=0
          for tarball in dist/*.tgz; do
            echo "== ${tarball}"
            contents=$(tar tzf "${tarball}")
            for required in package/package.json package/LICENSE package/out/main/index.js package/out/renderer/index.js; do
              if ! grep -qx "${required}" <<<"${contents}"; then
                echo "  missing ${required}" >&2
                status=1
              fi
            done
          done
          exit "${status}"

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*.tgz dist/SHA256SUMS
