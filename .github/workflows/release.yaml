name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from"
        required: true

permissions:
  contents: read

# Digest-pinned, as in ci.yaml. Keep in step with scripts/security/scan.sh.
env:
  OSV_SCANNER: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0

jobs:
  release:
    name: Build and publish tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # A tag can be pushed from anywhere: the same gate as CI, before the install runs anything.
      - name: Vulnerable dependencies and malware
        run: bash scripts/security/osv-direct.sh "${OSV_SCANNER}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run -r build

      # Repeated from CI: a tag can be pushed from anywhere.
      - name: Verify the bundles
        run: bash scripts/checks/verify-bundles.sh

      - name: Pack
        run: bash scripts/release/package-extensions.sh

      - name: Verify the tarballs
        run: |
          status=0
          for tarball in dist/*.tgz; do
            echo "== ${tarball}"
            contents=$(tar tzf "${tarball}")
            for required in package/package.json package/out/main/index.js package/out/renderer/index.js; do
              if ! grep -qx "${required}" <<<"${contents}"; then
                echo "  missing ${required}" >&2
                status=1
              fi
            done
          done
          exit "${status}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*.tgz dist/SHA256SUMS
