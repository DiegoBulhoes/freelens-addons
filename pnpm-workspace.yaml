packages:
  # Not under packages/: anything there must be a valid extension.
  - "build"
  - "packages/*"

# 15 days, in minutes. Declare ranges, not pins, so this floor chooses the version.
minimumReleaseAge: 21600

minimumReleaseAgeStrict: true

minimumReleaseAgeIgnoreMissingTime: false

# Kept from before the rule: no override for a transitive advisory, which waits for
# make deps-refresh or its parent's release (docs/security.md).
overrides:
  dompurify: "3.4.16"
  decode-uri-component: "0.5.0"

# Lifecycle scripts are opt-in. electron and node-pty arrive only for their types;
# the Electron in use is the one inside the Freelens container.
allowBuilds:
  esbuild: true
  electron: false
  node-pty: false
